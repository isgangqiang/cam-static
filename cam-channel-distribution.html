:root{
  --grad:linear-gradient(135deg,#7C5CFC 0%,#9F7AFF 100%);
  --primary:#7C5CFC;--primary-soft:#F1EDFE;--primary-ghost:#F7F4FE;
  --ink:#1C1633;--ink-2:#5A5478;--ink-3:#9B95B5;--ink-4:#B8B2CC;
  --green:#10B981;--green-soft:#DFF7EF;
  --orange:#F59E0B;--orange-soft:#FEF1DC;
  --pink:#EC4899;--pink-soft:#FDE7F1;
  --bg:#F7F6FC;--surface:#FFFFFF;--line:#EFECF8;
  --r-md:10px;--r-lg:14px;--r-pill:999px;
  --sh:0 2px 6px rgba(124,92,252,.05),0 8px 24px rgba(124,92,252,.06);
  --sh-grad:0 6px 16px rgba(124,92,252,.35);
  --ease:cubic-bezier(.2,0,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans SC','Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;height:100vh}

/* 侧边栏 */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-grad)}
.logo svg{width:19px;height:19px;color:#fff}
.brand-name b{font-size:16px;font-weight:800;display:block;line-height:1.15}
.brand-name small{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-top:1px;display:block}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a.lv1{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r-md);color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;cursor:pointer;transition:all .18s var(--ease)}
.nav a.lv1 .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav a.lv1 .ic svg{width:18px;height:18px}
.nav a.lv1 .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--orange-soft);color:var(--orange);padding:1px 7px;border-radius:var(--r-pill)}
.nav a.lv1:hover{background:var(--primary-soft);color:var(--ink)}
.nav a.lv1.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--sh-grad)}
.nav a.lv1.active .ic svg{color:#fff}
.nav a.lv1.active .badge{background:rgba(255,255,255,.25);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.goal{background:var(--primary-soft);border-radius:var(--r-lg);padding:14px 15px}
.goal .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.goal .row b{font-size:12.5px;font-weight:600}
.goal .row .pct{font-size:12.5px;font-weight:700;color:var(--primary)}
.goal .track{height:6px;background:#E4DDFB;border-radius:var(--r-pill);overflow:hidden}
.goal .fill{height:100%;width:74%;background:var(--grad);border-radius:var(--r-pill)}
.goal .sub{font-size:11px;color:var(--ink-3);margin-top:8px;display:block}
.user{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-lg);cursor:pointer;transition:box-shadow .18s var(--ease)}
.user:hover{box-shadow:var(--sh)}
.u-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#F97362,#EC4899);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.user .info{line-height:1.25;min-width:0}
.user .info b{font-size:12.5px;font-weight:600;display:block}
.user .info small{font-size:10.5px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user svg{width:14px;height:14px;color:var(--ink-3);margin-left:auto;flex-shrink:0}

/* 主区域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}
.crumbs b{color:var(--ink);font-weight:600;font-size:13.5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .18s var(--ease)}
.bell:hover{box-shadow:var(--sh)}
.bell svg{width:17px;height:17px;color:var(--ink-2)}
.bell .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--pink);border-radius:50%;border:1.5px solid #fff}
.t-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#F97362,#EC4899);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;cursor:pointer}

.scroll{flex:1;overflow-y:auto;padding:22px 26px 10px;scrollbar-width:thin;scrollbar-color:#D8D3EC transparent}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:#D8D3EC;border-radius:7px}

/* 页面头 */
.page-hd{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.page-hd h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.page-hd .desc{font-size:12.5px;color:var(--ink-3);margin-top:3px}

/* 即将上线 */
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 180px);text-align:center}
.cs-icon{width:120px;height:120px;border-radius:50%;background:var(--primary-ghost);display:flex;align-items:center;justify-content:center;margin-bottom:32px;position:relative}
.cs-icon::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--primary-soft);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cs-icon svg{width:54px;height:54px;color:var(--primary)}
.cs-title{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
.cs-badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;padding:5px 14px;border-radius:var(--r-pill);margin-bottom:18px}
.cs-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.cs-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;max-width:420px;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;border-radius:var(--r-pill);padding:11px 22px;transition:all .18s var(--ease);text-decoration:none}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-grad{background:var(--grad);color:#fff;box-shadow:var(--sh-grad)}
.btn-grad:hover{transform:translateY(-1px);filter:brightness(1.05)}

/* 状态栏 */
.statusbar{height:32px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 26px;background:var(--surface);border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.statusbar .ver{font-family:'Space Grotesk';font-weight:600;margin-left:auto}

// _nav() 创建临时 <a> 并触发 click，inject.js 会拦截并处理导航
window._nav = function(url){
  var a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); }, 200);
};
